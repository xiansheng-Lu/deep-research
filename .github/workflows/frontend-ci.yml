# 前端持续集成工作流（《前端 M0 收尾方案》§5 阶段 D / §8 交付物 D1）
# 门禁口径与本地一致：ESLint 零警告 + 全量类型检查 + 生产构建，构建产物上传为 artifact。
# 仅在前端目录或本工作流变更时触发，后端/文档改动不空跑。
name: Frontend CI

on:
  pull_request:
    branches:
      - dev
      - main
    paths:
      - frontend/**
      - .github/workflows/frontend-ci.yml
  push:
    branches:
      - dev
      - main
    paths:
      - frontend/**
      - .github/workflows/frontend-ci.yml
  workflow_dispatch:

# 最小权限：只读取仓库内容
permissions:
  contents: read

# 同一分支的新推送自动取消旧运行，避免重复占用额度
concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint / Typecheck / Build
    runs-on: ubuntu-latest
    defaults:
      run:
        # 前端工程位于仓库 frontend 子目录，所有命令在此目录执行
        working-directory: frontend

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          # 与 frontend/package.json 的 packageManager 字段保持一致
          version: 9.15.0
          run_install: false

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          # engines.node 要求 >=20，选用当前 LTS 大版本
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: ESLint 检查（零警告）
        run: pnpm lint

      - name: TypeScript 类型检查
        run: pnpm typecheck

      - name: 生产构建（含 vue-tsc 类型门禁）
        run: pnpm build

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          if-no-files-found: error
          # 仅用于验收/临时下载，保留 7 天
          retention-days: 7
