[project]
name = "deep-research-backend"
version = "0.1.0"
description = "AI 研究者助手 - 后端服务（多智能体深度研究平台）"
readme = "docs/prd/AI研究者助手-软件需求规格说明书.md"
requires-python = ">=3.11,<3.13"
license = { text = "Proprietary" }
authors = [
    { name = "AI Researcher Assistant Team" },
]

dependencies = [
    # Web 框架
    "fastapi>=0.115,<0.120",
    "uvicorn[standard]>=0.32,<0.36",
    "python-multipart>=0.0.12",
    # 数据校验
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.6,<3.0",
    # 数据库 & ORM
    "sqlalchemy[asyncio]>=2.0.36,<2.1",
    "alembic>=1.13,<2.0",
    "asyncpg>=0.30,<1.0",
    "psycopg2-binary>=2.9,<3.0",
    "pgvector>=0.3.6,<1.0",
    # 智能体编排
    "langgraph>=0.2,<1.0",
    "langchain-core>=0.3,<1.0",
    "langchain-community>=0.3,<1.0",
    # 异步任务
    "celery[redis]>=5.4,<6.0",
    "redis[hiredis]>=5.2,<6.0",
    # HTTP / 抓取
    "httpx>=0.27,<1.0",
    "tavily-python>=0.5,<1.0",
    "playwright>=1.48,<2.0",
    "trafilatura>=1.12,<2.0",
    "readability-lxml>=0.8.1",
    # 对象存储
    "minio>=7.2,<8.0",
    # 鉴权
    "python-jose[cryptography]>=3.3,<4.0",
    "passlib[bcrypt]>=1.7.4,<2.0",
    "pyjwt>=2.9,<3.0",
    # 日志 / 追踪
    "structlog>=24.4,<26.0",
    "opentelemetry-api>=1.27,<2.0",
    "opentelemetry-sdk>=1.27,<2.0",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    # 文档处理
    "python-docx>=1.1,<2.0",
    "openpyxl>=3.1,<4.0",
    "pypdf>=5.0,<6.0",
    # 工具
    "tenacity>=9.0,<10.0",
    "orjson>=3.10,<4.0",
    "python-dateutil>=2.9,<3.0",
    "pyyaml>=6.0,<7.0",
]

[dependency-groups]
dev = [
    "ruff>=0.7,<1.0",
    "mypy>=1.13,<2.0",
    "ipython>=8.29,<9.0",
    "pre-commit>=4.0,<5.0",
]

[project.scripts]
deep-research-api = "app.main:run"
deep-research-worker = "app.workers.celery_app:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["apps/api/app"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["apps/api/app"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "ASYNC",  # flake8-async
    "SIM",  # flake8-simplify
]
ignore = [
    "E501",  # 行长度交给 formatter
    "B008",  # 函数调用作为默认值（FastAPI 依赖常用）
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
files = ["apps/api/app"]
exclude = ["apps/api/app/db/migrations/"]

[[tool.mypy.overrides]]
module = ["langchain.*", "langgraph.*", "tavily.*", "trafilatura.*"]
ignore_missing_imports = true