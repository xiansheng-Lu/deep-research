# Alembic 迁移配置（同步连接串，避免与 async session 冲突）
[alembic]
script_location = apps/api/app/db/migrations
prepend_sys_path = apps/api
sqlalchemy.url = postgresql+psycopg2://deep_research:deep_research@localhost:5432/deep_research

# 运行时通过 env.py 注入实际 DB_SYNC_URL，覆盖上面的占位
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S