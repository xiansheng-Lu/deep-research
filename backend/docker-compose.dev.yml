# 本地一键依赖栈：PostgreSQL16+pgvector、Redis、MinIO
# 使用：docker compose -f docker-compose.dev.yml up -d
services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: dr_postgres
    environment:
      POSTGRES_DB: deep_research
      POSTGRES_USER: deep_research
      POSTGRES_PASSWORD: deep_research
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deep_research -d deep_research"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: dr_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: dr_minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5

  # M2-8b：Celery worker（API/uvicorn 仍在主机前台运行）
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: deep-research-worker:dev
    container_name: dr_worker
    command: ["deep-research-worker"]
    env_file:
      - .env
    environment:
      DB_ASYNC_URL: postgresql+asyncpg://deep_research:deep_research@postgres:5432/deep_research
      DB_SYNC_URL: postgresql://deep_research:deep_research@postgres:5432/deep_research
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      WORKER_ENABLE_REDIS: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  minio_data: